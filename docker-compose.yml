services:
  syncthing-observer:
    build:
      context: .
    container_name: syncthing-observer
    restart: unless-stopped
    init: true
    env_file:
      - .env
    ports:
      - "8787:8787"
    volumes:
      - syncthing-observer-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  syncthing-observer-data:
